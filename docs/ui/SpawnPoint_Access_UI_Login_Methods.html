function commandForOS(s){if(state.os==='windows')return s;return s.replaceAll('.\\','./').replaceAll('\\','/').replaceAll('.exe','').replaceAll('D:/','/srv/').replace('.cmd','.sh');}
function pathForOS(s){return state.os==='windows'?s:s.replace(/^D:\\(?:services|projects)\\/,'/srv/').replaceAll('\\','/');}
function accountForOS(s){return state.os==='windows'?s:s.replace(/^\.\\/,'');}

 dlg.innerHTML=`<form id="modalForm" class="dialog-layout"><header class="dialog-head"><div class="icon-box">${icon(data.icon||'settings')}</div><div><h2 id="modalTitle">${title}</h2><div class="eyebrow">${kicker}</div></div>${ib('닫기','close-modal','x')}</header><div class="dialog-body">${body}<div class="modal-error" id="modalError" role="alert"></div></div><footer class="dialog-foot">${footer}</footer></form>`;
 if(!dlg.open)dlg.showModal();
 requestAnimationFrame(()=>{const f=dlg.querySelector('input:not([type=checkbox]):not([disabled]),select,button');f?.focus();});
}
function modalFooter(primary='저장',hint=''){return `<span class="hint">${hint}</span><span class="spacer"></span>${button('취소','close-modal','quiet')}<button class="btn primary" type="submit">${primary}</button>`;}
function closeModal(force=false){if(!force&&modalState?.dirty&&!['impact','guide','audit','token-result'].includes(modalState.kind)){ask('변경 사항을 닫을까요?','저장하지 않은 입력이 사라집니다.','저장하지 않고 닫기',()=>closeModal(true));return;}$('#modal').close();$('#modal').innerHTML='';modalState=null;if(lastFocus?.isConnected)lastFocus.focus();}

function roleGuide(){openModal('역할과 실제 권한','PERMISSION MODEL',`<div class="table-scroll"><table class="rule-table"><thead><tr><th>기능</th>${Object.values(roles).map(r=>`<th>${r.label}</th>`).join('')}</tr></thead><tbody>${[['상태·로그 조회',[1,1,1,1]],['실행·중지·재시작',[0,1,1,1]],['명령·설정 편집',[0,1,1,1]],['프로세스 생성',[0,0,1,1]],['삭제·권한·사용자 관리',[0,0,0,1]]].map(([label,arr])=>`<tr><td>${label}</td>${arr.map(ok=>`<td class="${ok?'green':'muted'}">${icon(ok?'check':'x')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="rule"></div>${notice('역할만으로 모든 프로세스에 접근할 수는 없습니다. 관리자 외에는 대상 그룹·프로세스의 허용 범위 안에서만 작업할 수 있습니다.','muted','shield')}<p class="hint" style="margin-top:14px">삭제는 관리자 전용으로 제안합니다. 비로그인은 공개 상태만 조회하며 생성·편집·실행은 항상 금지합니다.</p>`,button('닫기','close-modal','primary'),'guide',{wide:true,icon:'shield'});}
function permissionGuide(){openModal('권한 적용 규칙','INHERITANCE & EXCEPTIONS',`<div class="effective-steps"><div class="effective-step"><small>01 · 역할</small><strong>역할이 허용하는 작업을 최대 범위로 사용</strong></div><div class="effective-step"><small>02 · 프로세스 그룹</small><strong>사용자·사용자 그룹별 기본 권한을 신규 프로세스에 자동 상속</strong></div><div class="effective-step"><small>03 · 프로세스 예외</small><strong>같은 대상의 규칙만 교체. 다른 상속 규칙은 유지</strong></div><div class="effective-step"><small>04 · 최종 판정</small><strong>사용자 직접 설정 → 그룹의 명시적 거부 → 그룹 허용의 최대 범위</strong></div><div class="effective-step"><small>05 · 보호 및 역할 상한</small><strong>역할 상한 적용 후, 보호 프로세스의 편집을 추가 제한</strong></div></div>${notice('<strong>접근 불가</strong>는 명시적 거부, <strong>설정 없음</strong>은 해당 규칙의 제거입니다. 관리자만 전체 접근을 갖고, 정지된 사용자는 어떤 규칙으로도 접근하지 못합니다.','muted','lock')}<p class="hint" style="margin-top:14px">프로세스 그룹은 하나만 소속합니다. 생성은 개발자 역할 이상 + 그룹의 생성 허용이 모두 필요합니다. 그룹 이동과 일괄 복원은 적용 전에 영향 확인을 거칩니다.</p>`,button('닫기','close-modal','primary'),'guide',{icon:'branch'});}

function aclModal(){const group=pg(state.policyGroup);const used=new Set([...Object.keys(group.rules),...Object.keys(state.policyDraft)]);const candidates=[...db.userGroups.map(g=>({key:'g:'+g.id,label:'그룹 · '+g.name})),...db.users.filter(u=>u.role!=='admin').map(u=>({key:'u:'+u.id,label:'사용자 · '+u.name}))].filter(v=>!used.has(v.key));if(!candidates.length){toast('추가할 사용자 또는 그룹이 없습니다.');return;}openModal('접근 대상 추가','ACCESS SUBJECT',`<div class="fields"><div class="field full"><label for="aclSubject">사용자 / 그룹</label><select id="aclSubject" name="subject">${candidates.map(v=>option(v.key,v.label)).join('')}</select></div><div class="field full"><label for="aclLevel">허용 범위</label><select id="aclLevel" name="level">${levels.map((l,i)=>option(i,l,1)).join('')}</select></div></div>`,modalFooter('변경안에 추가','다음 화면에서 영향 확인 후 적용'),'acl',{narrow:true,icon:'shield'});}
function accessDelta(beforeData,afterData,targets){
 const rows=[];for(const p of targets){const after=afterData.processes.find(v=>v.id===p.id);let granted=0,lost=0;for(const u of beforeData.users.filter(u=>u.status==='active'&&u.role!=='admin')){const a=access(u,p,beforeData),b=access(u,after,afterData);for(const key of ['view','logs','run','edit','create']){if(!a[key]&&b[key])granted++;if(a[key]&&!b[key])lost++;}}rows.push({p,after,granted,lost});}return rows;
}
function policyImpact(){const after=draftDatabase(),targets=policyTargets();const changes=accessDelta(db,after,targets);openModal('권한 변경 영향','REVIEW BEFORE APPLY',`<div class="impact-stats"><div class="impact-stat"><strong>${targets.length}</strong><small>대상 프로세스</small></div><div class="impact-stat"><strong>${changes.filter(x=>x.granted||x.lost).length}</strong><small>실제 권한 변경</small></div><div class="impact-stat"><strong>${targets.filter(p=>Object.keys(p.overrides).length).length}</strong><small>기존 개별 예외</small></div></div>${notice(state.policyTarget==='group'?'그룹 기본값을 변경합니다. <strong>기존 개별 예외는 유지</strong>되며, 새 프로세스도 변경된 기본값을 상속합니다.':'선택한 프로세스의 예외만 변경합니다. 다른 프로세스와 그룹 기본값은 유지됩니다.','muted','branch')}<div class="rule"></div><h3>프로세스별 변경</h3>${changes.map(x=>`<div class="difference"><div><strong>${esc(x.p.name)}</strong><small>${Object.keys(x.p.overrides).length?'개별 예외 있음':'그룹 상속'}</small></div><span class="green">허용 +${x.granted}</span>${icon('arrow')}<span class="${x.lost?'orange':'muted'}">회수 −${x.lost}</span></div>`).join('')}<p class="hint" style="margin-top:13px">활성 비관리자 계정의 작업 권한 변화를 합산했습니다. 실행 중인 프로세스는 중단하지 않고 다음 요청부터 새 권한을 적용하는 설계입니다.</p>`,modalFooter('권한 적용','시안 데이터에만 적용됩니다.'),'impact',{icon:'shield',after});}

function bulkModal(reset=false){const targets=state.checked.map(proc).filter(Boolean);if(!targets.length)return;openModal(reset?'그룹 권한으로 일괄 복원':'프로세스 그룹 이동','BULK CHANGE',`${notice('<strong>'+targets.length+'개 프로세스</strong>를 선택했습니다. 적용 전 사용자별 접근 변화가 표시됩니다.','muted','layers')}<div class="field" style="margin-top:18px"><label for="batchGroup">${reset?'기존 그룹':'이동할 그룹'}</label>${reset?'<p class="hint">현재 소속 그룹은 바꾸지 않고 개별 예외만 제거합니다.</p>':`<select id="batchGroup" name="targetGroup">${db.processGroups.map(g=>option(g.id,g.name)).join('')}</select>`}</div>${!reset?`<div class="rule"></div><label class="check-pill"><input type="checkbox" name="clearExceptions">개별 예외도 제거하고 새 그룹 권한만 상속</label><p class="hint" style="margin-top:8px">기본은 기존 예외 유지입니다.</p>`:''}<div class="rule"></div>${targets.map(p=>`<div class="cluster" style="padding:8px 0">${icon('terminal')}${esc(p.name)}<span class="spacer"></span>${badge(pg(p.pg).name)}${Object.keys(p.overrides).length?badge('예외 있음','amber'):''}</div>`).join('')}`,modalFooter('변경 영향 확인'),'batch',{targets:targets.map(p=>p.id),reset,icon:'layers'});}
function showBatchImpact(targetIds,destination,clear,reset){const before=db,after=clone(db);for(const p of after.processes.filter(p=>targetIds.includes(p.id))){if(!reset)p.pg=destination;if(clear||reset)p.overrides={};}const changes=accessDelta(before,after,targetIds.map(proc));openModal('일괄 변경 영향','BULK REVIEW',notice(reset?'선택한 프로세스의 <strong>모든 개별 예외를 제거</strong>합니다.':`<strong>${esc(pg(destination).name)}</strong> 그룹으로 이동합니다. 개별 예외는 <strong>${clear?'제거':'유지'}</strong>합니다.`,clear||reset?'amber':'muted','branch')+`<div class="rule"></div>${changes.map(x=>`<div class="difference"><div><strong>${esc(x.p.name)}</strong><small>${esc(pg(x.p.pg).name)} → ${esc(pg(x.after.pg).name)}</small></div><span class="green">허용 +${x.granted}</span>${icon('arrow')}<span class="${x.lost?'orange':'muted'}">회수 −${x.lost}</span></div>`).join('')}<p class="hint" style="margin-top:14px">보호 설정과 실행 계정은 변경하지 않습니다.</p>`,modalFooter('일괄 적용'),'batch-impact',{after,targets:targetIds,reset,icon:'layers'});}

function previewHelp(){openModal('시안 사용 안내','INTERACTIVE PROTOTYPE',`<h3>서버 없이 화면 흐름을 확인하는 HTML입니다.</h3><p>상단의 <strong>시점</strong>에서 관리자·개발자·참조자·뷰어·비로그인을 전환하세요. 모든 사용자는 예시이며 실제 인증이나 OS 명령 실행은 하지 않습니다.</p><div class="rule"></div><div class="key-values"><dt>관리자</dt><dd>사용자·그룹 편집, 권한 상속·개별 예외, 일괄 이동을 조작할 수 있습니다.</dd><dt>권한 미리보기</dt><dd>사용자와 대상을 바꾸면 최종 허용 범위를 계산해 보여줍니다.</dd><dt>로그인</dt><dd>OS 계정(DEMO\\admin / Linux admin) 또는 SpawnPoint 계정(recovery-admin / developer / viewer)을 선택합니다. 비밀번호는 임의 값을 쓰며 인증·저장하지 않습니다. Windows 자동 로그인은 별도 버튼으로 시뮬레이션합니다.</dd><dt>저장</dt><dd>브라우저 메모리에만 반영됩니다. 새로고침 또는 초기화하면 원래대로 돌아갑니다.</dd><dt>보안 경계</dt><dd>권한별 UI 동작 예시입니다. 실제 서버 API 권한 검사는 아직 구현하지 않았습니다.</dd></div><div class="rule"></div><p class="hint">기준 코드: main 42de3f87 · 기존 승인된 편집창의 팔레트와 입력 구조를 유지했습니다. 실제 비밀번호·개인정보를 입력하지 마세요.</p>`,button('확인','close-modal','primary'),'guide',{icon:'info'});}
function processAction(action,id){const p=proc(id);if(!p)return;const a=access(current(),p);if(!a.run){toast('실행 권한이 없습니다.');return;}if(action==='run'&&p.status==='running'||action==='stop'&&p.status!=='running')return;const label={run:'실행',stop:'중지',restart:'재시작'}[action];const apply=()=>{p.status=action==='stop'?'stopped':'running';p.pid=action==='stop'?null:18000+(++serial);p.uptime=action==='stop'?'—':'00:00:00';state.procSelected=p.id;addAudit('프로세스 '+label,p.name,'시안 상태 변경 · OS 실행 없음');render();toast(label+' 상태를 시안에 반영했습니다.');};if(action==='stop'||action==='restart')ask(p.name+' '+label,`${label} 동작을 시뮬레이션합니다. 실제 프로세스에는 영향을 주지 않습니다.`,label,apply);else apply();}

  if(old?.role==='admin'&&old.status==='active'&&(role!=='admin'||status!=='active')&&db.users.filter(u=>u.role==='admin'&&u.status==='active').length<=1){modalError('마지막 활성 관리자는 정지하거나 강등할 수 없습니다.');return;}

  const entry={id:old?.id||'u-'+(++serial),login,name,role,groups:form.getAll('userGroup'),auth,status,external:auth==='os'?external:'',last:old?.last||'아직 없음'};
  if(old)db.users[db.users.indexOf(old)]=entry;else db.users.push(entry);addAudit(old?'사용자 변경':'사용자 추가',login,roles[role].label+' · '+(status==='active'?'활성':'정지')+' · 세션 권한 재평가');
  closeModal(true);if(entry.id===state.actor&&entry.status==='paused'){state.actor=null;navigate('/login',true);}else render();toast('사용자 설정을 시안에 저장했습니다.');return;
 }
 if(m.kind==='user-group'){
  const name=String(form.get('name')).trim();if(!name)return modalError('그룹 이름을 입력하세요.');if(db.userGroups.some(g=>g.id!==m.id&&g.name===name))return modalError('같은 그룹 이름이 있습니다.');const id=m.id||'g-'+(++serial),members=form.getAll('members');const old=db.userGroups.find(g=>g.id===id);if(old){old.name=name;old.desc=String(form.get('desc'));}else db.userGroups.push({id,name,desc:String(form.get('desc')),icon:'users'});for(const u of db.users){u.groups=u.groups.filter(g=>g!==id);if(members.includes(u.id))u.groups.push(id);}addAudit('사용자 그룹 변경',name,members.length+'명 · 상속 권한 재평가');closeModal(true);render();toast('그룹 멤버를 반영했습니다.');return;
 }
 if(m.kind==='process-group'){
  const name=String(form.get('name')).trim();if(!name)return modalError('그룹 이름을 입력하세요.');if(db.processGroups.some(g=>g.id!==m.id&&g.name===name))return modalError('같은 그룹 이름이 있습니다.');const old=pg(m.id);if(old){old.name=name;old.desc=String(form.get('desc'));old.guest=form.has('guest');}else db.processGroups.push({id:'pg-'+(++serial),name,desc:String(form.get('desc')),rules:{},guest:form.has('guest')});addAudit('프로세스 그룹 변경',name,old?'그룹 설정 수정':'기본 접근 거부로 생성');closeModal(true);render();toast('프로세스 그룹을 저장했습니다.');return;
 }
 if(m.kind==='acl'){state.policyDraft[form.get('subject')]={level:Number(form.get('level')),create:false};state.policyDirty=true;closeModal(true);render();return;}
 if(m.kind==='impact'){
  const object=state.policyTarget==='group'?pg(state.policyGroup).name:proc(state.policyTarget).name;
  if(state.policyTarget==='group')pg(state.policyGroup).rules=clone(state.policyDraft);else proc(state.policyTarget).overrides=clone(state.policyDraft);
  state.policyDirty=false;state.policyDraft=null;addAudit('권한 변경',object,'변경 영향 확인 후 적용 · 개별 예외 보존');closeModal(true);render();toast('새 권한을 시안에 적용했습니다.');return;
 }
 if(m.kind==='batch'){const ids=m.targets,destination=form.get('targetGroup'),clear=form.has('clearExceptions'),reset=m.reset;closeModal(true);showBatchImpact(ids,destination,clear,reset);return;}
 if(m.kind==='batch-impact'){db.processes=m.after.processes;addAudit('프로세스 일괄 변경',m.targets.length+'개 프로세스',m.reset?'개별 예외 제거 · 그룹 상속 복원':'그룹 이동 · 영향 확인 완료');state.checked=[];closeModal(true);render();toast('일괄 변경을 시안에 적용했습니다.');return;}
 if(m.kind==='process'){
  const old=m.id?proc(m.id):null,user=current(),group=old?old.pg:form.get('pg');if(old?!access(user,old).edit:!canCreate(user,pg(group)))return modalError('이 작업을 수행할 권한이 없습니다.');
  const command=String(form.get('cmd')||'').trim();if(!command)return modalError('명령어를 입력하세요.');
  const keys=form.getAll('envKey'),vals=form.getAll('envValue'),env={};for(let i=0;i<keys.length;i++){const key=String(keys[i]).trim();if(!key&&vals[i]==='')continue;if(!key||/[=\0]/.test(key))return modalError('유효한 환경변수 이름을 입력하세요.');if(Object.hasOwn(env,key))return modalError('환경변수 이름이 중복됩니다: '+key);Object.defineProperty(env,key,{value:vals[i],enumerable:true,writable:true,configurable:true});}

  if(m.specific&&isAdmin()&&!account)return modalError('OS 사용자명을 입력하세요.');
  if(m.specific&&isAdmin()&&account!==accountForOS(old?.account||'')&&!form.get('executionPassword'))return modalError('새 계정에는 시안용 비밀번호를 입력하세요.');
  const run=e.submitter?.value==='run';const p={...(old||{id:'p-'+(++serial),overrides:{},guest:null,pid:null,uptime:'—'}),name:String(form.get('name')||'').trim()||command.split(' ')[0],cmd:command,cwd:String(form.get('cwd')||'').trim(),pg:group,account:isAdmin()?(m.specific?account:'Service account'):old?.account||'Service account',auto:form.has('auto'),protected:isAdmin()?form.has('protected'):old?.protected||false,env,status:run?'running':old?.status||'stopped'};
  if(run){p.pid=18000+(++serial);p.uptime='00:00:00';}if(old)db.processes[db.processes.indexOf(old)]=p;else db.processes.push(p);state.procSelected=p.id;addAudit(old?'프로세스 편집':'프로세스 생성',p.name,run?'설정 저장 및 실행 시뮬레이션':'설정만 저장 · 실행 상태 유지');closeModal(true);render();toast('시안에 저장했습니다. 실제 명령은 실행하지 않았습니다.');return;
 }
 if(m.kind==='token'){const t={id:'t-'+(++serial),name:String(form.get('name')).trim(),owner:form.get('owner'),scope:form.get('scope'),level:Number(form.get('level')),expiry:form.get('expiry'),last:'아직 없음'};if(!t.name)return modalError('토큰 이름을 입력하세요.');db.tokens.push(t);addAudit('API 토큰 생성',t.name,'예시 토큰 · 실제 인증 불가');closeModal(true);render();toast('사용 불가능한 예시 토큰을 추가했습니다.');return;}
 if(m.kind==='password'){if(form.get('new')!==form.get('repeat'))return modalError('새 비밀번호가 일치하지 않습니다.');addAudit('비밀번호 변경',current().login,'변경 흐름 시뮬레이션 · 입력값 저장 안 함');closeModal(true);toast('변경 흐름을 확인했습니다. 비밀번호는 저장하지 않았습니다.');return;}
});
