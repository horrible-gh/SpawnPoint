name: Verify browser reconnection
on:
  push:
    branches: [main]
    paths:
      - 'internal/webui/**'
      - 'internal/access/**'
      - 'tools/test-reconnect-browser.cjs'
      - 'tools/prepare-reconnect-candidate.cjs'
      - '.github/workflows/verify-reconnect.yml'
permissions:
  contents: read
jobs:
  reconnect:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare exact reconnect candidate
        shell: bash
        run: node tools/prepare-reconnect-candidate.cjs
      - name: Build the actual server and run focused regressions
        shell: bash
        run: |
          go build -o reconnect-server.exe ./cmd/spawnpoint
          node --test internal/webui/*test.cjs
          go test ./internal/webui
      - name: Install browser test dependency
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/spawnpoint-reconnect" playwright
          if [ "$RUNNER_OS" = Linux ]; then
            "$RUNNER_TEMP/spawnpoint-reconnect/node_modules/.bin/playwright" install --with-deps chromium
          else
            "$RUNNER_TEMP/spawnpoint-reconnect/node_modules/.bin/playwright" install chromium
          fi
      - name: Verify restart and network recovery without page reload
        shell: bash
        run: NODE_PATH="$RUNNER_TEMP/spawnpoint-reconnect/node_modules" node tools/test-reconnect-browser.cjs ./reconnect-server.exe
      - name: Store verified candidate blobs without moving any branch
        if: success() && runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const candidates = [];
            for (const path of ['internal/webui/access.html', 'tools/test-reconnect-browser.cjs']) {
              const bytes = fs.readFileSync(path);
              const {data} = await github.rest.git.createBlob({...context.repo, content: bytes.toString('base64'), encoding: 'base64'});
              candidates.push({path, sha: data.sha, sha256: crypto.createHash('sha256').update(bytes).digest('hex')});
            }
            fs.writeFileSync('artifacts/reconnect-candidate.json', JSON.stringify({base: context.sha, files: candidates}, null, 2));
            core.info(JSON.stringify(candidates));
      - name: Publish exact UI and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spawnpoint-reconnect-${{ matrix.os }}
          path: artifacts/reconnect-*
          if-no-files-found: ignore
          retention-days: 7
