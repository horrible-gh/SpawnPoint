name: Session verification offline kit
on:
  push:
    branches: [fix/remembered-sessions-20261112]
    paths: ['.github/workflows/session-offline-kit.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Bundle source and offline build dependencies
        run: |
          go mod vendor
          mkdir -p "$RUNNER_TEMP/session-kit"
          tar --exclude=.git -czf "$RUNNER_TEMP/session-kit/source.tar.gz" .
          tar -czf "$RUNNER_TEMP/session-kit/go-toolchain.tar.gz" -C "$(go env GOROOT)" .
      - uses: actions/upload-artifact@v4
        with:
          name: session-verification-kit
          path: ${{ runner.temp }}/session-kit/*
          retention-days: 1
