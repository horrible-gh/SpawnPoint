name: Apply verified access-control implementation
on:
  push:
    branches: [feature/access-control]
    paths: ['tools/.access-transfer.*', '.github/workflows/apply-access-control.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/feature/access-control'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Fetch pinned approved design reference
        run: git fetch --no-tags origin 2dc573e74a9e5d7f470ea08319fe4374b0417682
      - name: Reconstruct and verify exact tested source
        shell: python
        run: |
          import hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          parts = [root / ('tools/.access-transfer.' + str(i)) for i in range(4)]
          compressed = b''.join(p.read_bytes() for p in parts)
          assert len(compressed) == 48012, 'Transfer length mismatch'
          dec = lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw = dec.decompress(compressed, max_length=1024*1024)
          assert dec.eof and not dec.unused_data, 'Unexpected compressed stream'
          assert hashlib.sha256(raw).hexdigest() == '66e3c729954ea0e744e5792d521106fd10bc7636fe389ac02e741fbee8a45cc3', 'Transfer digest mismatch'
          entries = json.loads(raw)
          allowed = set('''README.md
          cmd/spawnpoint/main.go
          docs/access-control.md
          internal/access/admin.go
          internal/access/http.go
          internal/access/live_test.go
          internal/access/model.go
          internal/access/osauth_linux.go
          internal/access/osauth_other.go
          internal/access/osauth_windows.go
          internal/access/password.go
          internal/access/policy.go
          internal/access/policy_test.go
          internal/access/process.go
          internal/access/session.go
          internal/access/setup_linux.go
          internal/access/setup_linux_test.go
          internal/access/setup_other.go
          internal/access/setup_windows.go
          internal/access/store.go
          internal/access/transport_test.go
          internal/dialect/assets_test.go
          internal/dialect/sql/migration/sqlite/006_access_control.sql
          internal/httpapi/auth.go
          internal/httpapi/runas.go
          internal/store/autostart_test.go
          internal/store/runas_test.go
          internal/webui/access.html
          internal/webui/webui.go
          tools/test-access-api.py
          tools/test-access-browser.py
          tools/test-run-as-service.py'''.split())
          assert set(entries) == allowed and len(entries) == 32, 'Unexpected source paths'
          design = subprocess.check_output(['git','show','2dc573e74a9e5d7f470ea08319fe4374b0417682:docs/ui/SpawnPoint_Access_UI_Login_Methods.html'])
          output = {}
          for name, spec in entries.items():
              path = root / name
              assert path.resolve().is_relative_to(root) and not path.is_symlink()
              if 'new' in spec:
                  assert not path.exists(), 'New source already exists: ' + name
                  data = spec['new'].encode('utf-8')
              else:
                  if spec['base'] == 'design':
                      assert name == 'internal/webui/access.html'
                      base = design
                  else:
                      assert spec['base'] == 'current'
                      base = path.read_bytes()
                  assert hashlib.sha256(base).hexdigest() == spec['base_sha256'], 'Base digest mismatch: ' + name
                  lines = base.decode('utf-8').splitlines(keepends=True)
                  end = len(lines)
                  for start, stop, replacement in reversed(spec['edits']):
                      assert 0 <= start <= stop <= end, 'Overlapping/invalid edits'
                      lines[start:stop] = [replacement]
                      end = start
                  data = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == spec['sha256'], 'Source digest mismatch: ' + name
              output[path] = data
          for path, data in output.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          for p in parts:
              p.unlink()
          print('Verified and restored all 32 tested source files; removed transfer payloads.')
      - name: Publish only to the requested feature branch
        id: publish
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/feature/access-control | cut -f1)"
          test "$current" = "$EXPECTED_HEAD" || { echo 'Feature branch moved; refusing overwrite'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md cmd docs internal tools
          git diff --cached --check
          git commit -m 'Implement OS/local login, role and process access control with approved administration UI'
          git push origin HEAD:refs/heads/feature/access-control
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    permissions:
      contents: read
    uses: ./.github/workflows/verify-access-control.yml
    with:
      ref: ${{ needs.apply.outputs.commit }}
