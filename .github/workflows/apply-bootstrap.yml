name: Apply verified bootstrap upgrade
on:
  push:
    branches: [feature/access-control]
    paths: ['tools/bootstrap-transfer/**', '.github/workflows/apply-bootstrap.yml']
permissions:
  contents: read
jobs:
  apply:
    if: ${{ github.ref == 'refs/heads/feature/access-control' && contains(github.event.head_commit.message, '[bootstrap-transfer]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply exact locally tested patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, shutil, zlib
          parent = subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          assert parent == '95ad86f4e64a8ef5e29ae2cb1f5fcfe3eae9dbc5', parent
          payload = b''.join(Path(f'tools/bootstrap-transfer/part{i}').read_bytes() for i in range(10))
          patch = zlib.decompress(payload)
          assert hashlib.sha256(patch).hexdigest() == '497690d147305a8a81fa5763657003e61618ee80442c6f91713bd8dd5ee4ecd4'
          Path('/tmp/spawnpoint-bootstrap.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/spawnpoint-bootstrap.patch'],check=True)
          subprocess.run(['git','apply','/tmp/spawnpoint-bootstrap.patch'],check=True)
          shutil.rmtree('tools/bootstrap-transfer')
          Path('.github/workflows/apply-bootstrap.yml').unlink()
          print('Verified patch applied; one-time transfer removed.')
          PY
      - name: Publish only to the existing feature branch
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix first-admin setup with OS administrator authentication and local CLI on Windows/Linux'
          git push origin HEAD:refs/heads/feature/access-control
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    uses: ./.github/workflows/verify-access-control.yml
    with:
      ref: ${{ needs.apply.outputs.sha }}
    permissions:
      contents: read
