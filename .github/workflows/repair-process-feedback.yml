name: Validate process feedback repair
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-process-feedback.yml
      - tools/repair-process-feedback.py
      - internal/webui/process_feedback_test.cjs
      - internal/webui/process_feedback_test.go
permissions:
  contents: write
env:
  TZ: Asia/Tokyo
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Reproduce, patch, and validate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object internal/webui/access.html)" = '5b07710fa62625d757c5ce043491ffafd714378a'
          mkdir -p validation
          cp internal/webui/access.html validation/original-access.html
          if node --test internal/webui/process_feedback_test.cjs > validation/before.log 2>&1; then
            echo 'Expected the regression tests to fail before the fix'
            exit 1
          fi
          tail -12 validation/before.log
          python3 tools/repair-process-feedback.py
          node --test internal/webui/process_feedback_test.cjs | tee validation/after.log
          go build ./... 2>&1 | tee validation/build.log
          go test ./... 2>&1 | tee validation/go-test.log
          go test -race ./internal/webui 2>&1 | tee validation/race.log
          node tools/test-autostart-ui.cjs 2>&1 | tee validation/autostart.log
          git diff --check
          git diff -- internal/webui/access.html > validation/change.patch
          cp internal/webui/access.html validation/access.html
      - name: Store validated source blob without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          content = Path('internal/webui/access.html').read_text(encoding='utf-8')
          request = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs',
              data=json.dumps({'content': content, 'encoding': 'utf-8'}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'},
              method='POST',
          )
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
          proof = {'validated_access_html_blob': result['sha'], 'validated_commit': os.environ['GITHUB_SHA']}
          Path('validation/blob.json').write_text(json.dumps(proof), encoding='utf-8')
          print(json.dumps(proof))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: process-feedback-validation
          path: validation/
          retention-days: 1
