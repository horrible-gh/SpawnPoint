name: Verify access control
on:
  push:
    branches: [feature/access-control]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
env:
  TZ: Asia/Tokyo
jobs:
  verify:
    if: ${{ inputs.ref != '' || !contains(github.event.head_commit.message, '[bootstrap-transfer]') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Windows timezone and Secondary Logon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tzutil /s 'Tokyo Standard Time'
          Set-Service seclogon -StartupType Manual
          Start-Service seclogon
      - name: Build and regression
        shell: bash
        run: |
          go build ./...
          go test ./...
          node tools/test-autostart-ui.cjs
          SPAWNPOINT_LIVE_SPAWN=1 go test ./internal/runner -run 'AutoStart|TestLiveIdentity' -count=1 -v -timeout=2m
      - name: Linux packaging and race checks
        if: runner.os == 'Linux'
        run: |
          sh tools/dist.sh
          go test -race ./internal/requesttransport ./internal/access ./internal/httpapi ./internal/runner ./internal/store
      - name: Windows packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\dist.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Isolated Linux test identity
        if: runner.os == 'Linux'
        shell: bash
        run: |
          password="Sp!$(openssl rand -hex 18)aA4"
          echo "::add-mask::$password"
          sudo useradd -m -s /bin/sh spauthtarget
          printf '%s:%s\n' spauthtarget "$password" | sudo chpasswd
          chmod o+x "$HOME" "$HOME/work" "$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"
          echo "SPAWNPOINT_AUTH_TEST_USER=spauthtarget" >> "$GITHUB_ENV"
          echo "SPAWNPOINT_AUTH_TEST_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "SPAWNPOINT_RUNAS_TEST_USER=spauthtarget" >> "$GITHUB_ENV"
          echo "SPAWNPOINT_RUNAS_TEST_PASSWORD=$password" >> "$GITHUB_ENV"
          admin_password="Sa!$(openssl rand -hex 18)aA4"
          echo "::add-mask::$admin_password"
          sudo useradd -m -s /bin/sh spbootstrapadmin
          printf '%s:%s\n' spbootstrapadmin "$admin_password" | sudo chpasswd
          printf '%s\n' 'spbootstrapadmin ALL=(root) ALL' 'spauthtarget ALL=(root) NOPASSWD: /usr/bin/id' | sudo tee /etc/sudoers.d/spawnpoint-bootstrap-test >/dev/null
          sudo chmod 0440 /etc/sudoers.d/spawnpoint-bootstrap-test
          sudo visudo -cf /etc/sudoers.d/spawnpoint-bootstrap-test
          echo "SPAWNPOINT_ADMIN_TEST_USER=spbootstrapadmin" >> "$GITHUB_ENV"
          echo "SPAWNPOINT_ADMIN_TEST_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          sudo useradd -o -u 0 -g 0 -M -d /root -s /bin/sh spbootstraproot
          printf '%s:%s\n' spbootstraproot "$admin_password" | sudo chpasswd
          echo "SPAWNPOINT_ROOT_TEST_USER=spbootstraproot" >> "$GITHUB_ENV"
          echo "SPAWNPOINT_ROOT_TEST_PASSWORD=$admin_password" >> "$GITHUB_ENV"
      - name: Isolated Windows test identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $password = 'Sp!' + [guid]::NewGuid().ToString('N') + 'aA4'
          Write-Output "::add-mask::$password"
          New-LocalUser -Name spauthtarget -Password (ConvertTo-SecureString $password -AsPlainText -Force) -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -SID 'S-1-5-32-545' -Member spauthtarget
          "SPAWNPOINT_AUTH_TEST_USER=spauthtarget" >> $env:GITHUB_ENV
          "SPAWNPOINT_AUTH_TEST_PASSWORD=$password" >> $env:GITHUB_ENV
          "SPAWNPOINT_RUNAS_TEST_USER=spauthtarget" >> $env:GITHUB_ENV
          "SPAWNPOINT_RUNAS_TEST_PASSWORD=$password" >> $env:GITHUB_ENV
          $adminPassword = 'Sa!' + [guid]::NewGuid().ToString('N') + 'aA4'
          Write-Output "::add-mask::$adminPassword"
          New-LocalUser -Name spbootstrapadmin -Password (ConvertTo-SecureString $adminPassword -AsPlainText -Force) -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -SID 'S-1-5-32-544' -Member spbootstrapadmin
          "SPAWNPOINT_ADMIN_TEST_USER=spbootstrapadmin" >> $env:GITHUB_ENV
          "SPAWNPOINT_ADMIN_TEST_PASSWORD=$adminPassword" >> $env:GITHUB_ENV
      - name: Native OS authentication
        shell: bash
        run: go test ./internal/access -run 'TestLiveOSLogin|TestLiveOSAdmin' -count=1 -v -timeout=2m
      - name: Linux actual server authorization and service lifecycle
        if: runner.os == 'Linux'
        run: |
          python3 tools/test-access-diagnostics.py tools/test-access-api.py dist/linux64/spawnpoint
          python3 tools/test-bootstrap.py dist/linux64/spawnpoint
          python3 tools/test-caddy-https.py dist/linux64/spawnpoint --download-caddy
          python3 tools/test-run-as-service.py dist/linux64/spawnpoint
      - name: Windows actual server authorization and service lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/test-access-diagnostics.py tools/test-access-api.py dist/win64/spawnpoint.exe
          if ($LASTEXITCODE -ne 0) { throw 'API integration failed' }
          python tools/test-bootstrap.py dist/win64/spawnpoint.exe
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap integration failed' }
          python tools/test-caddy-https.py dist/win64/spawnpoint.exe --download-caddy
          if ($LASTEXITCODE -ne 0) { throw 'Caddy HTTPS integration failed' }
          python tools/test-run-as-service.py dist/win64/spawnpoint.exe
          if ($LASTEXITCODE -ne 0) { throw 'Service integration failed' }
      - name: Real browser HTTP, sessions and approved UI
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          python3 tools/test-access-browser.py dist/linux64/spawnpoint
          python3 tools/test-caddy-https.py dist/linux64/spawnpoint --download-caddy --browser
      - name: Formatting
        shell: bash
        run: test -z "$(git ls-files '*.go' | xargs gofmt -l)"
      - name: Source snapshot
        if: always() && runner.os == 'Linux'
        run: git archive --format=zip --output=spawnpoint-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: access-control-source
          path: spawnpoint-source.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: access-control-browser-evidence
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
