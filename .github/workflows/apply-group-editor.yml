name: Apply and verify process editor group change
on:
  push:
    branches: [fix/process-editor-group]
permissions:
  contents: read
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[editor-transfer]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact locally verified product source
        shell: bash
        run: |
          git merge-base --is-ancestor 2365129892ca46314860ba2b5b368d67ae0bb273 HEAD
          python3 - <<'PY'
          import base64, hashlib, json, subprocess, zlib
          from pathlib import Path
          transfer = Path('.github/group-editor-transfer')
          encoded = ''.join((transfer / ('part' + str(i))).read_text().strip() for i in range(4))
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '212893459c526f069cef9ffea8398b9981301a0de3cf0c1ca5b57ebd8e6ae42b', 'Patch checksum mismatch'
          manifest = json.loads((transfer / 'manifest.json').read_text())
          workflow = '.github/workflows/verify-access-control.yml'
          manifest.pop(workflow)
          subprocess.run(['git', 'apply', '--check', '--exclude=' + workflow, '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--exclude=' + workflow, '-'], input=patch, check=True)
          for name, expected in manifest.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          subprocess.run(['git', 'add', '--', *manifest], check=True)
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert actual == set(manifest), 'Unexpected product changes'
          subprocess.run(['git', 'rm', '-r', '.github/group-editor-transfer'], check=True)
          PY
      - name: Publish product changes to fix branch only
        id: publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Allow administrator group moves from process editor with permission impact confirmation'
          git push origin HEAD:refs/heads/fix/process-editor-group
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    uses: ./.github/workflows/verify-access-control.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.apply.outputs.ref }}
