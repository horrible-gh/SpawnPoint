name: Apply verified OS user form update
on:
  push:
    branches: [feature/access-control]
    paths: [.github/workflows/apply-os-user-update.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'horrible-gh/SpawnPoint' && github.ref == 'refs/heads/feature/access-control' && contains(github.event.head_commit.message, '[os-user-update]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply exact locally verified changes
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = cfbe471d4d8cfbc34a2d55ddb1c1b8ff313017e1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, runpy, shutil, subprocess
          entries = json.loads(Path('.github/os-user-hashes.json').read_text())
          for item in entries:
              path = Path(item['path'])
              if item['before'] is None:
                  assert not path.exists(), str(path)
              else:
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == item['before'], str(path)
          runpy.run_path('.github/update-os-user-ui.py')
          runpy.run_path('.github/update-os-user-tests.py')
          shutil.copyfile('.github/os_user_test.go.txt', 'internal/access/os_user_test.go')
          subprocess.run(['gofmt', '-w', 'internal/access/admin.go', 'internal/access/os_user_test.go'], check=True)
          for item in entries:
              assert hashlib.sha256(Path(item['path']).read_bytes()).hexdigest() == item['after'], item['path']
          subprocess.run(['git', 'add', '--'] + [item['path'] for item in entries], check=True)
          PY
          git diff --check
          go test ./internal/access ./internal/webui
      - name: Publish to the existing feature branch only
        id: publish
        shell: bash
        run: |
          git rm -- .github/update-os-user-ui.py .github/update-os-user-tests.py .github/os_user_test.go.txt .github/os-user-hashes.json .github/workflows/apply-os-user-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove redundant login ID from OS account links; preserve existing identities and grants'
          git push origin HEAD:refs/heads/feature/access-control
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    permissions:
      contents: read
    uses: ./.github/workflows/verify-access-control.yml
    with:
      ref: ${{ needs.apply.outputs.commit }}
