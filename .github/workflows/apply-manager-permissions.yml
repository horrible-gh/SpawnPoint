name: Apply and verify manager permissions
on:
  push:
    branches: [feature/manager-permissions]
permissions:
  contents: read
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[manager-transfer]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact locally tested source
        shell: bash
        run: |
          git merge-base --is-ancestor ca6b356f8e67a0933f979611f94df1342501d1aa HEAD
          python3 - <<'PY'
          import base64, hashlib, json, subprocess, zlib
          from pathlib import Path
          transfer = Path('.github/manager-transfer')
          encoded = ''.join((transfer / f'{i:02d}').read_text().strip() for i in range(12))
          raw = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '976732fcca100b5e2933250091c41231e394ea5d0f8e272d587dc1359b73ce0d', 'Transfer hash mismatch'
          changes = json.loads(raw)
          allowed = {'docs/access-control.md','internal/access/admin.go','internal/access/manager_policy_test.go','internal/access/model.go','internal/access/policy.go','internal/access/policy_test.go','internal/access/process.go','internal/access/process_response_test.go','internal/webui/access.html','tools/test-access-api.py','tools/test-access-browser.py'}
          assert len(changes) == len(allowed) and {c['path'] for c in changes} == allowed
          for change in changes:
              path = Path(change['path'])
              original = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(original).hexdigest() == change['old'], 'Base changed: ' + str(path)
              text = original.decode('utf-8')
              last = 0
              for start, end, replacement in change['edits']:
                  assert last <= start <= end <= len(text)
                  last = end
              for start, end, replacement in reversed(change['edits']):
                  text = text[:start] + replacement + text[end:]
              result = text.encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == change['new'], 'Output mismatch: ' + str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
          subprocess.run(['git','add','--',*sorted(allowed)], check=True)
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          assert actual == allowed, 'Unexpected changes'
          subprocess.run(['git','rm','-r','.github/manager-transfer'], check=True)
          PY
      - name: Publish only to the manager feature branch
        id: publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add scoped manager role, explicit create/delete grants and compact reauthentication UI'
          git push origin HEAD:refs/heads/feature/manager-permissions
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    uses: ./.github/workflows/verify-access-control.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.apply.outputs.ref }}
