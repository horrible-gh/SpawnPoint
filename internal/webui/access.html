/* Login authentication source selector — the two credential stores are distinct. */
.login-method-picker{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;margin:23px 0 19px;border:1px solid #384b60;border-radius:9px;background:#0c141d}

.login-method-picker button .ico{width:15px;height:15px}
.login-method-picker button[aria-selected="false"]:hover:not(:disabled){background:#1d2c3d;color:#d4e4f7}

.login-source-note .ico{color:#88b5e9;width:15px;height:15px;margin-top:2px}
.login-source-note strong{display:block;color:#cadced;font-size:11px;font-weight:650}
.login-source-note small{display:block;font-size:10px;color:#89a0ba;margin-top:3px}
.login-auto-row{margin-top:15px;padding-top:13px;border-top:1px solid #293949}
.login-auto-row .btn{width:100%;border-color:#3e536c;background:#1d2e43;color:#cce3fb}
.login-auto-row small{display:block;margin-top:8px;text-align:center;color:#819ab3;font-size:10px;line-height:1.6}
.login-method-off{font-size:10px;color:#e9b47d;padding-bottom:12px}

.auth-faq-item{border-bottom:1px solid var(--edge)}
.auth-faq-item:last-child{border-bottom:0}
.auth-faq-item summary{display:flex;align-items:center;gap:12px;padding:15px 2px;color:#cfdeef;font-size:12px;font-weight:600;cursor:pointer;list-style:none}
.auth-faq-item summary::-webkit-details-marker{display:none}
.auth-faq-item summary:after{content:'+';font-size:18px;font-weight:400;color:#92afca;margin-left:auto}
.auth-faq-item[open] summary:after{content:'−'}
.auth-faq-answer{padding:0 10px 16px 2px;color:#a3b4c7;font-size:11px;line-height:1.8}
.auth-faq-answer code{display:block;margin:9px 0;padding:9px 11px;background:#0e151e;border:1px solid #304053;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;color:#cde0f5;font-size:11px}
.auth-token-form .field{margin:0 0 14px}
.auth-token-form .btn.primary{width:100%;margin-top:6px}
.auth-token-form .auth-command{margin-bottom:18px}
@media(max-width:420px){.auth-faq-dialog .dialog-body{padding:12px 17px 18px}.auth-command-actions{align-items:stretch}.auth-command-actions .btn{flex:1}}

/* Compact registration: authentication -> identity -> privileges -> optional groups */
.auth-kind{margin:0 0 18px}.auth-kind select{width:100%}.user-identity-fields{row-gap:16px}
.user-identity-fields .field[hidden]{display:none!important}
.compact-groups{border-top:1px solid var(--edge);padding-top:15px;margin-top:2px}
.compact-groups .checks{margin-top:8px;min-height:0}
.locale-control{display:inline-flex;gap:6px;align-items:center;color:var(--secondary);flex:none}
.locale-control .ico{height:14px;width:14px}
.locale-control select{height:32px;padding:4px 7px;border:1px solid var(--edge-strong);border-radius:6px;background:var(--surface2);color:var(--text);font-size:11px;min-width:90px}
.auth-controls{display:flex;align-items:center;gap:9px;margin-left:auto}
@media(max-width:480px){.auth-heading{flex-wrap:wrap;gap:8px}.auth-heading h1{width:100%;font-size:21px}.auth-controls{gap:5px;width:100%;justify-content:flex-end}.auth-controls .locale-control .ico{display:none}.locale-control select{min-width:75px;padding:4px 3px}.auth-help{padding:0 6px}.topbar .locale-control select{min-width:72px}.topbar .locale-control .ico{display:none}}
#processMoveDialog .impact-stat{display:flex;align-items:center;justify-content:space-between;gap:10px}#processMoveDialog .impact-stat span{font-size:11px}#processMoveDialog .permission-labels{display:flex;gap:6px;flex-wrap:wrap;min-width:100px}

/* Access rules: one subject, one access selector, independent lifecycle grants. */
.acl-rules{padding:16px 18px;display:grid;gap:14px}
.acl-rule{border:1px solid var(--edge);border-radius:8px;padding:16px;background:#10171f;min-width:0}
.acl-rule-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.acl-rule-head .subject{min-width:0;display:flex;align-items:center;gap:10px}.acl-rule-head .subject strong{display:block;font-size:12px;overflow-wrap:anywhere}.acl-rule-head .subject small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.acl-lifecycle-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.acl-lifecycle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--edge);border-radius:7px;cursor:pointer;min-width:0}
.acl-lifecycle strong{display:block;font-size:11px}.acl-lifecycle small{display:block;font-size:10px;color:var(--muted);margin-top:5px}
.acl-lifecycle.unavailable{opacity:.55;cursor:default}
.grant-switch{appearance:none;-webkit-appearance:none;width:34px!important;height:20px!important;min-width:34px;flex:none;border:1px solid #52718d;border-radius:20px;background:#263443;padding:0;position:relative;cursor:pointer}
.grant-switch:after{content:'';display:block;position:absolute;width:12px;height:12px;border-radius:50%;background:#aabed3;left:3px;top:3px;transition:transform .12s}
.grant-switch:checked{background:#345b81}.grant-switch:checked:after{transform:translateX(14px);background:#c6defb}
.grant-switch:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.grant-switch:disabled{cursor:default}
.reauth-dialog{width:min(420px,calc(100% - 32px))}.reauth-dialog .dialog-head{padding:20px 24px}
.reauth-dialog .dialog-body{padding:24px}.reauth-dialog .field label{display:block;margin-bottom:9px}
.reauth-dialog input{display:block;width:100%;min-width:0}.reauth-dialog .dialog-foot{justify-content:flex-end;padding:16px 24px;gap:10px}
.reauth-dialog .modal-error:empty{display:none}
@media(max-width:560px){.acl-rules{padding:12px}.acl-rule{padding:14px}.acl-lifecycle-grid{grid-template-columns:1fr}.reauth-dialog .dialog-head,.reauth-dialog .dialog-body{padding:18px}.reauth-dialog .dialog-foot{padding:14px 18px}.reauth-dialog .dialog-foot .btn{min-width:80px}}

function accessDelta(beforeData,afterData,targets){
 const rows=[];for(const p of targets){const after=afterData.processes.find(v=>v.id===p.id);let granted=0,lost=0;for(const u of beforeData.users.filter(u=>u.status==='active'&&u.role!=='admin')){const a=access(u,p,beforeData),b=access(u,after,afterData);for(const key of ['view','logs','run','edit','create','remove']){if(!a[key]&&b[key])granted++;if(a[key]&&!b[key])lost++;}}rows.push({p,after,granted,lost});}return rows;
}

async function reviewProcessGroup(process,destination,revision,restart){
 const preview=await adminRequest({action:'bulk',revision,ids:[process.id],destination,clear:false},'/api/access/preview');
 const a=preview.impact,dlg=$('#processMoveDialog');
 const permissionLabels=value=>value?value.split(/\s+/).map(word=>`<span>${esc(word)}</span>`).join(''):'—';
 dlg.innerHTML=`<div class="dialog-layout"><header class="dialog-head"><div class="icon-box">${icon('folder')}</div><h2 id="processMoveTitle">그룹 변경 영향</h2></header><div class="dialog-body"><div class="cluster"><span translate="no">${esc(pg(process.pg)?.name||process.pg)}</span><span aria-hidden="true">→</span><strong translate="no">${esc(pg(destination)?.name||destination)}</strong></div><div class="impact-stats section-gap"><div class="impact-stat"><span>권한 확대</span><strong>${a.gained}</strong></div><div class="impact-stat"><span>권한 축소</span><strong>${a.lost}</strong></div></div><div class="table-scroll"><table><thead><tr><th>사용자</th><th>프로세스</th><th>추가</th><th>제거</th></tr></thead><tbody>${a.rows.map(r=>`<tr><td translate="no">${esc(r.user)}</td><td translate="no">${esc(r.process)}</td><td><div class="permission-labels">${permissionLabels(r.gained)}</div></td><td><div class="permission-labels">${permissionLabels(r.lost)}</div></td></tr>`).join('')||'<tr><td colspan="4">접근 권한 변화 없음</td></tr>'}</tbody></table></div>${a.truncated?'<p class="hint">처음 500개 변경을 표시합니다.</p>':''}</div><footer class="dialog-foot"><span class="hint">개별 예외 유지</span><span class="spacer"></span><button type="button" class="btn quiet" id="processMoveCancel">취소</button><button type="button" class="btn primary" id="processMoveApply">${restart?'그룹 변경 후 저장·재시작':'그룹 변경 후 저장'}</button></footer></div>`;
 return new Promise(resolve=>{
  let settled=false;
  const finish=value=>{if(settled)return;settled=true;dlg.oncancel=null;dlg.onclose=null;dlg.close();dlg.innerHTML='';resolve(value);};
  $('#processMoveCancel').onclick=()=>finish(null);
  $('#processMoveApply').onclick=()=>finish(preview.revision);
  dlg.oncancel=e=>{e.preventDefault();finish(null);};
  dlg.onclose=()=>finish(null);
  dlg.showModal();localizeAll();$('#processMoveCancel').focus();
 });
}

async function persistProcessOrder(id,targetId,after){
 if(processOrderBusy||!isAdmin()||id===targetId)return;
 const ids=db.processes.map(p=>p.id),from=ids.indexOf(id),target=ids.indexOf(targetId);
 if(from<0||target<0)return;
 ids.splice(from,1);ids.splice(ids.indexOf(targetId)+(after?1:0),0,id);
 if(ids.every((value,index)=>value===db.processes[index].id))return;
 processOrderBusy=true;
 try{
  await adminRequest({action:'process.order',ids});

   // credentials; failed fetches must not be mistaken for logout.
