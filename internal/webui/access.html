 if(values.some(v=>v.rule.level===0))chosen={level:0,create:false,source:'사용자 그룹의 명시적 거부'};

function ensureDraft(){const target=state.policyTarget==='group'?pg(state.policyGroup):proc(state.policyTarget);if(!state.policyDraft){state.policyRevision=app.revision;state.policyDraft=clone(state.policyTarget==='group'?target.rules:target.overrides);}}
function draftDatabase(){const data=clone(db);if(state.policyTarget==='group')pg(state.policyGroup,data).rules=clone(state.policyDraft);else data.processes.find(p=>p.id===state.policyTarget).overrides=clone(state.policyDraft);return data;}
function policyTargets(data=db){return state.policyTarget==='group'?data.processes.filter(p=>p.pg===state.policyGroup):data.processes.filter(p=>p.id===state.policyTarget);}
function permissionsView(){
 ensureDraft();const group=pg(state.policyGroup),groupMode=state.policyTarget==='group';const targets=db.processes.filter(p=>p.pg===group.id);
 const keys=Array.from(new Set([...Object.keys(group.rules),...Object.keys(state.policyDraft)]));
 const effective=activeUsers().find(u=>u.id===state.effectiveUser)||activeUsers()[0];state.effectiveUser=effective.id;
 const data=draftDatabase(),target=groupMode?{id:'example',pg:group.id,overrides:{},protected:false,guest:null}:data.processes.find(p=>p.id===state.policyTarget);
 const a=access(effective,target,data),grant=groupGrant(effective,pg(group.id,data),{...pg(group.id,data).rules,...target.overrides});
 const exceptionCount=targets.filter(p=>Object.keys(p.overrides).length).length;
 return pageTitle('ADMINISTRATION / ACCESS','프로세스 권한','그룹에 기본 권한을 지정하고, 필요한 프로세스만 예외를 둡니다.',button('권한 규칙','permission-guide','quiet','info'))+`<div class="permission-layout"><aside class="group-tree"><div class="tree-heading">프로세스 그룹${ib('프로세스 그룹 추가','add-process-group','plus')}</div>${db.processGroups.map(g=>`<button class="tree-item ${group.id===g.id?'active':''}" data-policy-group="${g.id}">${icon('folder')}${esc(g.name)}<small>${db.processes.filter(p=>p.pg===g.id).length}</small></button>${group.id===g.id?`<div class="tree-sub">${db.processes.filter(p=>p.pg===g.id&&Object.keys(p.overrides).length).length}개 개별 예외</div>`:''}`).join('')}<div class="tree-foot"><span class="hint" style="font-size:9px">기본은 접근 거부<br>신규 프로세스는 그룹 자동 상속</span></div></aside><div><div class="policy-layout"><section class="panel"><div class="policy-header"><div class="cluster"><div class="icon-box">${icon('folder')}</div><div><h2>${esc(group.name)}</h2><span class="hint">${targets.length}개 프로세스 · ${exceptionCount}개 예외</span></div><span class="spacer"></span>${badge(groupMode?'그룹 기본 권한':'개별 예외',groupMode?'blue':'amber',groupMode?'branch':'edit')}</div><div class="policy-target"><label for="policyTarget">적용 대상</label><select id="policyTarget">${option('group','그룹 기본 권한 · 전체 상속',state.policyTarget)}${targets.map(p=>option(p.id,p.name+(Object.keys(p.overrides).length?' · 예외 있음':''),state.policyTarget)).join('')}</select></div></div><div class="policy-subhead"><strong>접근 대상과 권한</strong><span class="hint">${groupMode?'신규 프로세스에도 적용':'상속값은 변경하지 않음'}</span></div><div class="table-scroll"><table class="acl-table"><thead><tr><th>사용자 / 그룹</th><th>허용 범위</th>${groupMode?'<th title="개발자 역할 이상만 생성 가능">생성</th>':''}<th class="origin-cell">적용 방식</th></tr></thead><tbody>${keys.map(key=>{const s=subjectInfo(key);const explicit=Object.hasOwn(state.policyDraft,key);const value=explicit?state.policyDraft[key].level:-1;const from=group.rules[key];return `<tr><td><div class="subject">${icon(s.icon)}<div><strong>${esc(s.name)}</strong><small>${esc(s.sub)}</small></div></div></td><td><select data-acl="${esc(key)}" aria-label="${esc(s.name)} 권한">${option(-1,groupMode?'설정 없음':`그룹 상속${from?' · '+levelLabel(from.level):''}`,value)}${levels.map((l,i)=>option(i,l,value)).join('')}</select></td>${groupMode?`<td><input type="checkbox" data-create-grant="${esc(key)}" aria-label="${esc(s.name)} 그룹 내 생성 허용" ${state.policyDraft[key]?.create?'checked':''} ${value<=0?'disabled':''}></td>`:''}<td class="origin-cell"><span class="acl-origin ${!groupMode&&explicit?'changed':''}">${!groupMode&&explicit?'개별 설정':groupMode?'그룹 기본':'그룹 상속'}</span></td></tr>`;}).join('')||`<tr><td colspan="4"><div class="empty">허용 규칙이 없습니다.</div></td></tr>`}</tbody></table></div><div class="acl-add">${button('사용자 / 그룹 추가','add-acl','quiet small','plus')}</div><div class="policy-note">${icon('branch')}<span>${groupMode?'그룹 변경은 상속 중인 프로세스에 반영됩니다.<br><strong>개별 예외는 그대로 유지</strong>하며, 생성 권한은 개발자 역할 이상에만 적용됩니다.':'이 프로세스에서 지정한 항목만 그룹 기본값을 대체합니다.<br><strong>그룹 상속</strong>으로 되돌리면 해당 예외가 제거됩니다.'}</span></div></section><section class="panel effective">${head('실제 권한 미리보기',icon('eye'))}<div class="panel-body"><div><label for="effectiveUser">확인할 사용자</label><select id="effectiveUser">${activeUsers().map(u=>option(u.id,`${u.name} · ${roles[u.role].label}`,state.effectiveUser)).join('')}</select>${roleBadge(effective.role)}</div><div class="effective-steps"><div class="effective-step"><small>01 · 사용자 역할 상한</small><strong>${roles[effective.role].label}</strong></div><div class="effective-step"><small>02 · 대상 접근 권한</small><strong>${esc(grant.source)}</strong></div><div class="effective-step"><small>03 · 프로세스 예외 / 보호</small><strong>${groupMode?'그룹 기본값 기준':target.protected?'보호됨 · 편집은 관리자만':Object.keys(target.overrides).length?'개별 예외 반영':'그룹 권한 상속'}</strong></div></div><div class="effective-result"><div class="result-name">최종 허용${badge(a.edit?'편집·실행':a.run?'실행':a.view?'조회':'접근 불가',a.view?'blue':'red')}</div>${capabilityGrid(a)}</div><p class="fine">${state.policyDirty?'저장 전 변경안을 기준으로 계산합니다. ':''}${groupMode?'개별 프로세스의 예외·보호는 대상을 선택해 확인하세요.':'프로세스 생성은 소속 그룹 권한을 기준으로 판단합니다.'}</p></div></section></div><div class="policy-save ${state.policyDirty?'':'clean'}"><div>${state.policyDirty?'<strong>저장되지 않은 변경 사항</strong>':'<strong>현재 저장된 권한</strong>'}<small>${groupMode?targets.length+'개 프로세스 · 개별 예외 유지':'선택한 프로세스 1개만 적용'}</small></div><span class="spacer"></span>${button('되돌리기','reset-policy','quiet small','',state.policyDirty?'':'disabled')}${button('변경 영향 확인','preview-policy','primary','arrow',state.policyDirty?'':'disabled')}</div></div></div>`;
}

function accessDelta(beforeData,afterData,targets){
 const rows=[];for(const p of targets){const after=afterData.processes.find(v=>v.id===p.id);let granted=0,lost=0;for(const u of beforeData.users.filter(u=>u.status==='active'&&u.role!=='admin')){const a=access(u,p,beforeData),b=access(u,after,afterData);for(const key of ['view','logs','run','edit','create']){if(!a[key]&&b[key])granted++;if(a[key]&&!b[key])lost++;}}rows.push({p,after,granted,lost});}return rows;
}

  if(!data.persisted)throw new Error('설정을 저장하지 못했습니다. 실행하지 않았습니다.');
  let result=data;if(submitter?.value==='run')result=await request('/processes/'+encodeURIComponent(id)+'/'+(m.id?'restart':'run'),{});
  state.procSelected=id;await saved(submitter?.value==='run'?'저장 후 실행을 요청했습니다.':'설정을 저장했습니다.');
  if(result.process?.status==='failed')toast(result.process.error||'프로세스 실행에 실패했습니다.');break;
 }
 case 'token':{const data=await adminRequest({action:'token.create',revision,name:String(form.get('name')||'').trim(),owner:String(form.get('owner')),scope:String(form.get('scope')),level:Number(form.get('level')),create:form.has('create'),expiry:String(form.get('expiry'))});await saved('토큰을 생성했습니다.');openModal('API 토큰 생성 완료','SHOWN ONCE',`${notice('이 값은 다시 표시되지 않습니다. 안전한 곳에 보관하세요.','amber','key')}<textarea id="newTokenValue" readonly class="mono" style="margin-top:16px;width:100%">${esc(data.secret)}</textarea>`,button('복사','copy-token','primary')+button('닫기','close-modal','quiet'),'token-result',{icon:'key'});break;}
 case 'password':{if(form.get('new')!==form.get('repeat'))throw new Error('새 비밀번호가 일치하지 않습니다.');const data=await request('/auth/password',{password:String(form.get('old')||''),new_password:String(form.get('new')||'')});app.csrf=data.csrf;await saved('비밀번호를 변경했습니다. 다른 세션과 기존 토큰은 무효화됐습니다.');break;}
 }
 }catch(error){if(f.id==='loginForm'||f.id==='setupForm'||f.id==='setupOSForm')$('#loginError').textContent=error.message;else handleError(error);}
 finally{f.dataset.busy='0';buttons.forEach(b=>b.disabled=false);}
});
$('#authHelpDialog').addEventListener('click',e=>{if(e.target.id==='authHelpDialog')e.target.close();});
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal();});
$('#confirm').addEventListener('cancel',()=>confirmCallback=null);
$('#reauthDialog').addEventListener('cancel',()=>{reauthResolve?.reject(new Error('재인증을 취소했습니다.'));reauthResolve=null;});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-process-row]')){state.procSelected=e.target.dataset.processRow;render();pollLog();}if(e.key==='Escape')closeMenu();});
window.addEventListener('hashchange',()=>{if(app.ready)navigate(location.hash.slice(1)||'/login');});
let heartbeatAt=0;['pointerdown','keydown'].forEach(event=>document.addEventListener(event,()=>{if(state.actor&&Date.now()-heartbeatAt>60000){heartbeatAt=Date.now();request('/auth/heartbeat',{}).catch(handleError);}}));
let refreshing=false;setInterval(async()=>{if(!app.ready||refreshing||document.hidden||state.route!=='/processes'||$('#modal').open||$('#confirm').open||document.activeElement?.matches('input,select,textarea'))return;refreshing=true;try{await loadState();render();await pollLog();}catch(e){handleError(e);}finally{refreshing=false;}},4000);
setInterval(()=>{if(!document.hidden)pollLog();},1500);
boot();
